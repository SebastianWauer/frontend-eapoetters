name: Datenschutzerklaerung einmalig aktualisieren

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: E&A-Poetters-Ziel aus der Verwaltung laden
        env:
          VERWALTUNG_URL: ${{ secrets.VERWALTUNG_URL }}
          CI_TOKEN: ${{ secrets.VERWALTUNG_CI_TOKEN }}
        run: |
          set -euo pipefail
          STATUS=$(curl -sS --max-time 30 -o /tmp/ziel.json -w '%{http_code}' \
            -H "X-Ci-Token: $CI_TOKEN" \
            "${VERWALTUNG_URL%/}/api/ci/deploy-target?customer=4")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Verwaltung antwortete mit HTTP $STATUS."
            exit 1
          fi

          for pfad in .ssh.password .tokens.health .tokens.api; do
            wert=$(jq -r "$pfad // empty" /tmp/ziel.json)
            [ -n "$wert" ] && echo "::add-mask::$wert"
          done

          {
            echo "SSH_HOST=$(jq -r '.ssh.host' /tmp/ziel.json)"
            echo "SSH_PORT=$(jq -r '.ssh.port' /tmp/ziel.json)"
            echo "SSH_USER=$(jq -r '.ssh.user' /tmp/ziel.json)"
            echo "SSHPASS=$(jq -r '.ssh.password' /tmp/ziel.json)"
            echo "CMS_PATH=$(jq -r '.ssh.cms_path' /tmp/ziel.json)"
            echo "CMS_URL=$(jq -r '.urls.cms' /tmp/ziel.json)"
          } >> "$GITHUB_ENV"

      - name: Datenschutzerklaerung mit Revision aktualisieren
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null

          case "$CMS_PATH" in
            /|/CMS|/Frontend|"")
              echo "::error::Unsicherer CMS-Pfad '$CMS_PATH'."
              exit 1
              ;;
          esac
          if [[ ! "$CMS_PATH" =~ ^[A-Za-z0-9._~/:+-]+$ ]]; then
            echo "::error::Ungueltiger CMS-Pfad."
            exit 1
          fi

          sshpass -e ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$CMS_PATH' && php" < .github/scripts/update-privacy-page.php

      - name: Oeffentliche Angaben pruefen
        run: |
          set -euo pipefail
          curl -sS --max-time 30 \
            "${CMS_URL%/}/api.php/api/v1/pages/datenschutz" > /tmp/datenschutz.json
          jq -e '.blocks | tostring | contains("IONOS SE")' /tmp/datenschutz.json >/dev/null
          if jq -e '.blocks | tostring | contains("Vercel")' /tmp/datenschutz.json >/dev/null; then
            echo "::error::Die Vercel-Angabe ist weiterhin vorhanden."
            exit 1
          fi
          jq -e '.blocks | tostring | contains("Inter und Barlow Condensed")' /tmp/datenschutz.json >/dev/null
          echo "Die veroeffentlichte Datenschutzerklaerung ist aktualisiert."
